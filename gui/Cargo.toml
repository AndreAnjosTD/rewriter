[package]
name = "rustrewrite-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop interface for rustrewrite"
license = "MIT"

[[bin]]
name = "rustrewrite-gui"
path = "src/main.rs"

[dependencies]
# The glow backend keeps the dependency tree (and the build) smaller than the
# default wgpu one; this app draws nothing that needs wgpu.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui_extras = "0.37"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
