[package]
name = "rustrewrite"
version = "0.1.0"
edition = "2021"
description = "Recipe-driven, verified refactoring for Rust: OpenRewrite-style rewrites with an automatic correctness gate"
license = "MIT"
build = "build.rs"

[[bin]]
name = "rustrewrite"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ast-grep-config = "0.51"
ast-grep-core = "0.51"
ast-grep-language = "0.51"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "2"
walkdir = "2"

# Starting the warm server without handing it the caller's stdout pipe needs
# CreateProcessW directly; the stable std flag for this is nightly-only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }
