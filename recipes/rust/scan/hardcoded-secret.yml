id: rust.scan.hardcoded-secret
name: Find string literals assigned to secret-looking names
description: >-
  A credential written into a `let` binding or a const is a leak waiting for a
  commit. OpenRewrite's Go pack carries AvoidHardcodedCredentials for the same
  reason this recipe exists: it reports, because only a human can tell a real key
  from a placeholder or a test fixture.
tags: [scan, security]
risk: high
mode: scan

steps:
  - rule:
      all:
        - pattern: let $NAME = $VALUE;
        - has:
            pattern: $VALUE
            kind: string_literal
    constraints:
      NAME:
        regex: "(?i)(password|passwd|secret|api_?key|token|credential)"
    message: a string literal is assigned to a secret-looking name

examples:
  - before: let api_key = "sk-live-9f2c";
    after: let api_key = "sk-live-9f2c";
    why: Scan recipes report the binding and leave the code untouched.
