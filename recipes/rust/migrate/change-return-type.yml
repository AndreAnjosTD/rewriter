id: rust.migrate.change-return-type
name: Change a function's return type
description: >-
  Replaces the declared return type of one resolved function. An existing
  annotation is rewritten in place; a signature with no `->` gets one inserted
  before the body or the `where` clause. Call sites are deliberately not
  rewritten: a caller that relied on the old type is a compile error, and the
  correctness gate rolls the whole run back rather than guessing at the fix. This
  is the Rust form of OpenRewrite's ChangeMethodInvocationReturnType.
tags: [migrate, semantic]
risk: medium

options:
  file:
    description: Path to the file that declares the function, relative to the run root.
    required: true
  anchor:
    description: >-
      Text on the declaration line, used to find it. For example
      `fn major(&self) -> u8`.
    required: true
  from:
    description: The function's current name, as written on the declaration line.
    required: true
  to:
    description: The new return type, e.g. `u64`.
    required: true

steps:
  - kind: semantic
    action: change-return-type
    file: ${file}
    anchor: ${anchor}
    from: ${from}
    to: ${to}
